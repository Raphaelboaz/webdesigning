<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Birthday Loading Josephat</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      color: #fff;
      text-align: center;

      /* Photo background — place your image in the same folder */
      background: url("birthday.jpg") no-repeat top center fixed;
      background-size: cover;
      position: relative;
    }

    /* Overlay with opacity and gradient colors */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(0,0,0,0.3), rgba(0,150,255,0.3));
      z-index: -1;
    }

    .title {
      margin-top: 20vh;
      position: relative;
      z-index: 2; /* keep text above fireworks */
    }
    .loading {
      font-size: 2.2em; /* reduced size for phones */
      color: #ff33cc;
      animation: glow 2s infinite alternate;
      letter-spacing: 3px;
    }
    .name {
      font-size: 2em; /* reduced size */
      margin-top: 15px;
      color: #33ccff;
      animation: glow2 2s infinite alternate;
      letter-spacing: 2px;
    }
    .date {
      font-size: 1.8em; /* reduced size */
      margin-top: 12px;
      color: #ffcc00;
      animation: glow3 2s infinite alternate;
      letter-spacing: 2px;
    }
    @keyframes glow {
      from { text-shadow: 0 0 8px #ff00ff; }
      to { text-shadow: 0 0 20px #00ffff; }
    }
    @keyframes glow2 {
      from { text-shadow: 0 0 8px #00ffff; }
      to { text-shadow: 0 0 20px #0066ff; }
    }
    @keyframes glow3 {
      from { text-shadow: 0 0 8px #ff6600; }
      to { text-shadow: 0 0 20px #ffff33; }
    }
    .balloon {
      position: absolute;
      bottom: -150px;
      width: 40px; /* smaller balloons for mobile */
      height: 60px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      animation: float 8s infinite ease-in;
      z-index: 1;
    }
    @keyframes float {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-110vh); opacity: 0; }
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0; /* fireworks behind text */
    }
  </style>
</head>
<body>
  <div class="title">
    <div class="loading">BIRTHDAY LOADING ----</div>
    <div class="name">JOSPHAT</div>
    <div class="date">23 ---- 05</div>
  </div>
  <canvas id="fireworks"></canvas>

  <script>
    // Balloons
    function createBalloon() {
      const balloon = document.createElement('div');
      balloon.className = 'balloon';
      balloon.style.left = Math.random() * window.innerWidth + 'px';
      balloon.style.background = `hsl(${Math.random()*360}, 70%, 60%)`;
      document.body.appendChild(balloon);
      setTimeout(() => balloon.remove(), 8000);
    }
    setInterval(createBalloon, 400);

    // Fireworks
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    function Firework(x, y) {
      this.x = x;
      this.y = y;
      this.particles = [];
      for (let i = 0; i < 100; i++) { // smaller fireworks
        this.particles.push({
          x: x,
          y: y,
          angle: Math.random() * 2 * Math.PI,
          speed: Math.random() * 5 + 2,
          radius: Math.random() * 2 + 1, // smaller particle size
          alpha: 1
        });
      }
    }
    Firework.prototype.update = function() {
      this.particles.forEach(p => {
        p.x += Math.cos(p.angle) * p.speed;
        p.y += Math.sin(p.angle) * p.speed;
        p.alpha -= 0.02;
      });
    };
    Firework.prototype.draw = function() {
      this.particles.forEach(p => {
        ctx.fillStyle = `rgba(${Math.floor(Math.random()*255)},${Math.floor(Math.random()*255)},${Math.floor(Math.random()*255)},${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
        ctx.fill();
      });
    };

    let fireworks = [];
    function loop() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      fireworks.forEach((f, i) => {
        f.update();
        f.draw();
        if (f.particles.every(p => p.alpha <= 0)) fireworks.splice(i,1);
      });
      requestAnimationFrame(loop);
    }
    loop();

    setInterval(() => {
      for (let i = 0; i < 4; i++) { // fewer fireworks at once
        fireworks.push(new Firework(Math.random()*canvas.width, Math.random()*canvas.height/2));
      }
    }, 900); // slower frequency
  </script>
</body>
</html>
